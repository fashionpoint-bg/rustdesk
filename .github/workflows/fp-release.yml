name: FashionPoint build

# Builds one FashionPoint edition with the upstream pipeline (flutter-build.yml), with that edition's
# client config compiled in (load_custom_client in src/common.rs):
# - clinic (secret FP_CLIENT_CONFIG_CLINIC): for clinic computers. Receives connections only, accepts
#   them with the computer's permanent password, registers with the Pro server.
# - staff (secret FP_CLIENT_CONFIG_STAFF): staff log in with their account and connect out; never registers.
# - Tag fp-v<upstream version>-<n> (e.g. fp-v1.5.0-2) builds the clinic edition, tag
#   fp-staff-v<upstream version>-<n> the staff edition: build, sign and upload to the release of the tag.
# - Manual run: build the chosen edition only (nothing is uploaded) unless "publish" is ticked (then
#   unsigned, to the release fp-test-<edition>).
# After an upload the release becomes a draft, its files are named FPRemote-Clinic-* / FPRemote-Staff-*,
# the clinic release gets the install scripts from res/fashionpoint/clinic/, and the run's artifacts are
# deleted (a public repo's artifacts can be downloaded by any GitHub user).
# Signing inputs. Windows: vars AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
# AZURE_CERT_PROFILE + secret AZURE_CLIENT_SECRET. macOS: secrets MACOS_P12_BASE64, MACOS_P12_PASSWORD,
# MACOS_CODESIGN_IDENTITY (the certificate's SHA-1 fingerprint, so it needs no shell quoting), APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
# Android: secrets ANDROID_SIGNING_KEY, ANDROID_ALIAS, ANDROID_KEY_STORE_PASSWORD, ANDROID_KEY_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to build"
        type: choice
        options:
          - clinic
          - staff
        default: clinic
      publish:
        description: "Upload the build to the fp-test-<edition> release (unsigned)"
        type: boolean
        default: false
  push:
    tags:
      - "fp-v*"
      - "fp-staff-v*"

permissions:
  contents: read

env:
  EDITION: ${{ github.event_name == 'workflow_dispatch' && inputs.edition || (startsWith(github.ref_name, 'fp-staff-v') && 'staff' || 'clinic') }}
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('fp-test-{0}', inputs.edition) }}
  UPLOAD: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish == true }}

jobs:
  check-config:
    runs-on: ubuntu-latest
    outputs:
      edition: ${{ env.EDITION }}
      release-tag: ${{ env.RELEASE_TAG }}
      upload: ${{ env.UPLOAD }}
    steps:
      - name: Validate the edition's client config
        env:
          FP_CLIENT_CONFIG_CLINIC: ${{ secrets.FP_CLIENT_CONFIG_CLINIC }}
          FP_CLIENT_CONFIG_STAFF: ${{ secrets.FP_CLIENT_CONFIG_STAFF }}
        shell: python
        run: |
          import json, os, sys

          edition = os.environ["EDITION"]
          secret = f"FP_CLIENT_CONFIG_{edition.upper()}"
          raw = os.environ.get(secret, "")
          if not raw:
              sys.exit(f"The {secret} secret is empty: the build would be a stock RustDesk.")
          try:
              config = json.loads(raw)
          except ValueError as e:
              sys.exit(f"{secret} is not valid JSON: {e}")
          override = config.get("override-settings") or {}
          errors = []

          def expect(where, key, value):
              if where.get(key) != value:
                  errors.append(f"{key} must be {value}")

          name = config.get("app-name") or ""
          if not name or name == "RustDesk" or not name.replace("-", "").isalnum():
              errors.append("app-name must be set, differ from RustDesk and have no spaces (it becomes a URI scheme)")
          for key in ("custom-rendezvous-server", "relay-server", "key"):
              if not override.get(key):
                  errors.append(f"override-settings.{key} is missing")
          if not str(override.get("api-server", "")).startswith("https://"):
              errors.append("override-settings.api-server must be the https console address (clients that miss it never reach the API)")
          expect(override, "allow-auto-update", "N")
          if edition == "clinic":
              expect(config, "conn-type", "incoming")
              expect(config, "disable-account", "Y")
              expect(override, "approve-mode", "password")
              expect(override, "verification-method", "use-permanent-password")
              if override.get("register-device") == "N":
                  errors.append("register-device must not be N: clinic computers register with the console")
              if config.get("disable-settings") == "Y":
                  expect(override, "allow-command-line-settings-when-settings-disabled", "Y")
          else:
              expect(config, "conn-type", "outgoing")
              if config.get("disable-account") == "Y":
                  errors.append("disable-account must not be Y: staff log in with their account")
          if errors:
              sys.exit(f"{secret}: " + "; ".join(errors))
          print(f"{secret} is valid: app-name {name}, edition {edition}")

  prepare:
    needs: check-config
    if: needs.check-config.outputs.upload == 'true' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove the previous test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$RELEASE_TAG" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true

  build:
    needs: [check-config, prepare]
    if: ${{ !failure() && !cancelled() && needs.check-config.result == 'success' }}
    permissions:
      contents: write # Publish Release
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: ${{ needs.check-config.outputs.upload == 'true' }}
      upload-tag: ${{ needs.check-config.outputs.release-tag }}
      fashionpoint: true
      edition: ${{ needs.check-config.outputs.edition }}

  finalize:
    needs: [check-config, build]
    if: ${{ always() && needs.check-config.outputs.upload == 'true' && needs.check-config.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: res/fashionpoint

      - name: Name the files, attach the install scripts, make the release a draft
        run: |
          set -euo pipefail
          title=$([ "$EDITION" = staff ] && echo Staff || echo Clinic)
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "map(select(.tag_name == \"$RELEASE_TAG\")) | first | .id // empty")
          if [ -z "$release" ]; then
            echo "No release $RELEASE_TAG: the build uploaded nothing." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$release/assets?per_page=100" --jq '.[] | "\(.id) \(.name)"' |
            while read -r id name; do
              case "$name" in
                rustdesk*)
                  gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name="FPRemote-$title${name#rustdesk}" --jq .name
                  ;;
              esac
            done
          if [ "$EDITION" = clinic ]; then
            gh release upload "$RELEASE_TAG" res/fashionpoint/clinic/*.ps1 --clobber -R "$GITHUB_REPOSITORY"
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release" -F draft=true \
            -f name="FPRemote $title $RELEASE_TAG" \
            -f body="FPRemote, $EDITION edition, built from $GITHUB_SHA (run $GITHUB_RUN_ID). Build result: ${{ needs.build.result }}." \
            --jq '"draft=\(.draft) name=\(.name)"'

      - name: Delete this run's artifacts
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --paginate --jq '.artifacts[] | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "deleted $name"
            done
